app:
  title: Skills Marketplace Developer Hub
  baseUrl: http://localhost:3000

organization:
  name: Red Hat

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]

# Skills Marketplace plugin configuration
skillMarketplace:
  neo4j:
    uri: ${NEO4J_URI:-bolt://localhost:7687}
    user: ${NEO4J_USER:-neo4j}
    password: ${NEO4J_PASSWORD:-changeme}
    database: ${NEO4J_DATABASE:-neo4j}

  kagenti:
    apiUrl: ${KAGENTI_API_URL:-https://kagenti-api.your-cluster.example.com}
    agentName: ${KAGENTI_AGENT_NAME:-skill-builder}
    namespace: ${KAGENTI_AGENT_NS:-team1}
    # Optional: bypass Kagenti chat proxy and call the agent directly via A2A.
    # Useful when Backstage runs inside the cluster and can reach the agent's internal URL.
    # directA2AUrl: ${KAGENTI_DIRECT_A2A_URL:-}
    keycloak:
      tokenUrl: ${KEYCLOAK_TOKEN_URL:-https://keycloak.your-cluster.example.com/realms/kagenti/protocol/openid-connect/token}
      clientId: ${KEYCLOAK_CLIENT_ID:-kagenti}
      username: ${KEYCLOAK_USERNAME:-admin}
      password: ${KEYCLOAK_PASSWORD:-changeme}

  oci:
    cacheTimeout: 300
    publishRegistry:
      url: ${OCI_PUBLISH_REGISTRY_URL:-https://registry.your-cluster.example.com/your-namespace}
      token: ${OCI_REGISTRY_TOKEN:-your-registry-token}
    # Single namespace URL -- all skill-* repos are discovered via _catalog.
    # Falls back to direct tag listing if _catalog is unavailable.
    registries:
      - url: ${OCI_REGISTRY_URL:-https://registry.your-cluster.example.com/your-namespace}
        name: skills-registry
        token: ${OCI_REGISTRY_TOKEN:-your-registry-token}

  # WARNING: Set to 'none' ONLY for local development. Use 'plugin-only' in production.
  security:
    mode: ${SKILL_MARKETPLACE_SECURITY_MODE:-plugin-only}
